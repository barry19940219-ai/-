name: Temporary CZ6522 daily ADS-B archive extraction

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download 2026-07-11 public ADS-B archive and extract B-2285
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG='v2026.07.11-planes-readsb-prod-0'
          HEX='79a054'
          mkdir -p work output
          cd work
          gh release view "$TAG" --repo adsblol/globe_history_2026 --json tagName,assets > release.json
          cat release.json
          gh release download "$TAG" --repo adsblol/globe_history_2026 --pattern "${TAG}.tar*"
          ls -lh
          mapfile -t PARTS < <(find . -maxdepth 1 -type f -name "${TAG}.tar*" | sort)
          test ${#PARTS[@]} -gt 0
          if [ ${#PARTS[@]} -eq 1 ] && [[ "${PARTS[0]}" == *.tar ]]; then
            cp "${PARTS[0]}" archive.tar
          else
            cat "${PARTS[@]}" > archive.tar
          fi
          ls -lh archive.tar
          tar -tf archive.tar | grep -E "traces/[0-9a-fA-F]{2}/trace_full_${HEX}\.json$" | tee matches.txt
          MATCH=$(head -n1 matches.txt)
          test -n "$MATCH"
          tar -xf archive.tar "$MATCH"
          cp "$MATCH" ../output/2026-07-11_B-2285_79a054.json.gz
          python3 - <<'PY'
          import gzip,json,datetime
          fn='../output/2026-07-11_B-2285_79a054.json.gz'
          with gzip.open(fn,'rt') as f:d=json.load(f)
          tr=d.get('trace',[]); base=d.get('timestamp',0)
          print({'icao':d.get('icao'),'registration':d.get('r'),'type':d.get('t'),'points':len(tr),'timestamp':base})
          if tr:
              times=[base+p[0] for p in tr]
              print('UTC',datetime.datetime.fromtimestamp(min(times),datetime.UTC),datetime.datetime.fromtimestamp(max(times),datetime.UTC))
          PY
      - name: Upload extracted B-2285 trace
        uses: actions/upload-artifact@v4
        with:
          name: cz6522-2026-07-11-B-2285
          path: output/*
          if-no-files-found: error
          retention-days: 1
