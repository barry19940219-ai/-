name: Temporary CZ6522 browser track fetch

on:
  push:
    branches: [temp-cz6522-track]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch with Playwright browser
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
          cat > fetch.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser = await chromium.launch({headless:true,args:['--disable-blink-features=AutomationControlled','--no-sandbox']});
          const context = await browser.newContext({
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
            viewport:{width:1440,height:1000}, locale:'en-US', timezoneId:'UTC'
          });
          const page = await context.newPage();
          await page.goto('https://www.flightradar24.com/data/flights/cz6522',{waitUntil:'domcontentloaded',timeout:120000});
          for (let i=0;i<12;i++) {
            await page.waitForTimeout(5000);
            console.log('wait',i,'title=',await page.title(),'url=',page.url());
            if ((await page.locator('#tbl-datatable').count())>0) break;
          }
          await page.screenshot({path:'output/page.png',fullPage:true});
          fs.writeFileSync('output/page.html',await page.content());
          const rows=await page.locator('#tbl-datatable tbody tr').evaluateAll(trs=>trs.map(tr=>{
            const b=tr.querySelector('.btn-playback');
            return b?{text:tr.innerText.replace(/\s+/g,' ').trim(),flight_id:b.getAttribute('data-flight-hex'),timestamp:b.getAttribute('data-timestamp'),outer:b.outerHTML}:null;
          }).filter(Boolean));
          console.log(JSON.stringify(rows,null,2));
          fs.writeFileSync('output/rows.json',JSON.stringify(rows,null,2));
          const wanted=rows.filter(r=>/0[6-9] Jul 2026|10 Jul 2026|11 Jul 2026/.test(r.text));
          const summary=[];
          for (let i=0;i<wanted.length;i++) {
            const r=wanted[i];
            const url=`https://api.flightradar24.com/common/v1/flight-playback.json?flightId=${r.flight_id}&timestamp=${r.timestamp}`;
            const resp=await context.request.get(url,{headers:{Origin:'https://www.flightradar24.com',Referer:'https://www.flightradar24.com/'},timeout:120000});
            const body=await resp.body();
            fs.writeFileSync(`output/playback_${i}_${r.flight_id}.json`,body);
            summary.push({...r,url,status:resp.status(),bytes:body.length,contentType:resp.headers()['content-type']});
            console.log(summary.at(-1));
          }
          fs.writeFileSync('output/summary.json',JSON.stringify(summary,null,2));
          fs.writeFileSync('output/cookies.json',JSON.stringify(await context.cookies(),null,2));
          await browser.close();
          if (!wanted.length) process.exitCode=2;
          JS
          node fetch.mjs || true
          find output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - name: Upload browser results
        uses: actions/upload-artifact@v4
        with:
          name: cz6522-browser-playback
          path: output/*
          if-no-files-found: error
          retention-days: 1
