name: Temporary CZ6522 six-flight playback extraction

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Extract six historical flights with headed Chrome
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          cat > fetch.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const flights=[
            {date:'2026-07-11',id:'409b6d74',ts:'1783735500',reg:'B-2285'},
            {date:'2026-07-10',id:'40974157',ts:'1783649100',reg:'B-9911'},
            {date:'2026-07-09',id:'4092f97f',ts:'1783562700',reg:'B-2287'},
            {date:'2026-07-08',id:'408e4798',ts:'1783476300',reg:'B-32PR'},
            {date:'2026-07-07',id:'408a4357',ts:'1783389900',reg:'B-2284'},
            {date:'2026-07-06',id:'4085e60c',ts:'1783303500',reg:'B-303K'}
          ];
          const browser=await chromium.launch({channel:'chrome',headless:false,args:['--no-sandbox','--disable-blink-features=AutomationControlled','--disable-dev-shm-usage','--start-maximized']});
          const context=await browser.newContext({viewport:null,locale:'en-US',timezoneId:'UTC'});
          await context.addInitScript(()=>{
            Object.defineProperty(navigator,'webdriver',{get:()=>undefined});
            Object.defineProperty(navigator,'languages',{get:()=>['en-US','en']});
            Object.defineProperty(navigator,'plugins',{get:()=>[1,2,3,4,5]});
          });
          const page=await context.newPage();
          async function loadHistory(){
            await page.goto('https://www.flightradar24.com/data/flights/cz6522',{waitUntil:'domcontentloaded',timeout:120000});
            for(let i=0;i<40;i++){await page.waitForTimeout(1000);if(await page.locator('#tbl-datatable').count())return;}
            throw new Error('history table unavailable');
          }
          await loadHistory();
          // Prime the API subdomain challenge; the main-page click then receives clearance.
          const f0=flights[0];
          const challenge=await context.newPage();
          await challenge.goto(`https://api.flightradar24.com/common/v1/flight-playback.json?flightId=${f0.id}&timestamp=${f0.ts}`,{waitUntil:'domcontentloaded',timeout:120000}).catch(()=>null);
          for(let i=0;i<70;i++){
            await challenge.waitForTimeout(1000);
            const txt=((await challenge.title().catch(()=>''))+' '+(await challenge.locator('body').innerText().catch(()=>'')));
            if(!/just a moment|performing security verification|verify you are human/i.test(txt))break;
          }
          await challenge.close();
          const summary=[];
          for(const f of flights){
            await loadHistory();
            const selector=`#btn-playback-${f.id}`;
            const responsePromise=page.waitForResponse(r=>r.url().includes('flight-playback.json')&&r.url().includes(f.id),{timeout:120000});
            await page.locator(selector).scrollIntoViewIfNeeded();
            await page.locator(selector).click({timeout:30000});
            const resp=await responsePromise;
            const body=await resp.body();
            const file=`output/${f.date}_${f.reg}_${f.id}.json`;
            fs.writeFileSync(file,body);
            let points=null,callsign=null,registration=null,error=null;
            try{
              const d=JSON.parse(body.toString());
              const flight=d?.result?.response?.data?.flight;
              points=flight?.track?.length??null;
              callsign=flight?.identification?.callsign??null;
              registration=flight?.aircraft?.identification?.registration??null;
            }catch(e){error=String(e);}
            summary.push({...f,status:resp.status(),contentType:resp.headers()['content-type'],bytes:body.length,points,callsign,registration,error,file});
            await page.waitForTimeout(2500);
          }
          fs.writeFileSync('output/summary.json',JSON.stringify(summary,null,2));
          fs.writeFileSync('output/browser.json',JSON.stringify(await page.evaluate(()=>({ua:navigator.userAgent,webdriver:navigator.webdriver,brands:navigator.userAgentData?.brands||null})),null,2));
          await context.close(); await browser.close();
          if(summary.some(x=>x.status!==200||!x.points))process.exitCode=2;
          JS
          xvfb-run -a node fetch.mjs
          cat output/summary.json
      - name: Upload six playback files
        uses: actions/upload-artifact@v4
        with:
          name: cz6522-six-real-tracks
          path: output/*
          if-no-files-found: error
          retention-days: 1
