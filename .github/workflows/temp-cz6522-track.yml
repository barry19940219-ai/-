name: Temporary CZ6522 playback endpoint extraction

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Probe same-origin playback and download endpoints
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
          cat > fetch.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const id='409b6d74';
          const ts='1783735500';
          const browser=await chromium.launch({headless:true,args:['--disable-blink-features=AutomationControlled','--no-sandbox']});
          const context=await browser.newContext({
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
            viewport:{width:1440,height:1000},locale:'en-US',timezoneId:'UTC',
            extraHTTPHeaders:{'accept-language':'en-US,en;q=0.9'}
          });
          const page=await context.newPage();
          const captured=[];
          page.on('response',async resp=>{
            const u=resp.url();
            if(/playback|flight-playback|download\/\?file|track|trail/i.test(u)){
              let body=Buffer.alloc(0); try{body=await resp.body();}catch{}
              const n=captured.length;
              fs.writeFileSync(`output/network_${n}.bin`,body);
              captured.push({url:u,status:resp.status(),contentType:resp.headers()['content-type'],bytes:body.length,file:`network_${n}.bin`});
            }
          });
          await page.goto('https://www.flightradar24.com/data/flights/cz6522',{waitUntil:'domcontentloaded',timeout:120000});
          for(let i=0;i<20;i++){await page.waitForTimeout(2000);if(await page.locator('#tbl-datatable').count())break;}
          fs.writeFileSync('output/cookies.json',JSON.stringify(await context.cookies(),null,2));
          const endpoints=[
            `https://www.flightradar24.com/common/v1/flight-playback.json?flightId=${id}&timestamp=${ts}`,
            `https://www.flightradar24.com/v1/flight-playback.json?flightId=${id}&timestamp=${ts}`,
            `https://api.flightradar24.com/common/v1/flight-playback.json?flightId=${id}&timestamp=${ts}`,
            `https://www.flightradar24.com/download/?file=kml&trailLimit=0&flight=${id}&history=${ts}`,
            `https://www.flightradar24.com/download/?file=csv&trailLimit=0&flight=${id}&history=${ts}`
          ];
          const results=[];
          for(let i=0;i<endpoints.length;i++){
            const u=endpoints[i];
            try{
              const r=await context.request.get(u,{headers:{referer:'https://www.flightradar24.com/data/flights/cz6522',origin:'https://www.flightradar24.com','accept':'application/json,text/plain,*/*'},timeout:120000});
              const b=await r.body();
              fs.writeFileSync(`output/request_${i}.bin`,b);
              results.push({mode:'context.request',url:u,status:r.status(),contentType:r.headers()['content-type'],bytes:b.length,file:`request_${i}.bin`});
            }catch(e){results.push({mode:'context.request',url:u,error:String(e)});}
          }
          // Same-origin browser fetch inherits the established browser session and origin.
          for(let i=0;i<2;i++){
            const path=i===0?`/common/v1/flight-playback.json?flightId=${id}&timestamp=${ts}`:`/download/?file=kml&trailLimit=0&flight=${id}&history=${ts}`;
            try{
              const obj=await page.evaluate(async path=>{const r=await fetch(path,{credentials:'include',headers:{accept:'application/json,text/plain,*/*'}});const a=await r.arrayBuffer();return {status:r.status,ct:r.headers.get('content-type'),data:Array.from(new Uint8Array(a))};},path);
              const b=Buffer.from(obj.data); fs.writeFileSync(`output/browser_fetch_${i}.bin`,b);
              results.push({mode:'page.fetch',url:path,status:obj.status,contentType:obj.ct,bytes:b.length,file:`browser_fetch_${i}.bin`});
            }catch(e){results.push({mode:'page.fetch',url:path,error:String(e)});}
          }
          // Navigate to playback hash and let the site run its own code.
          try{
            await page.goto(`https://www.flightradar24.com/data/flights/cz6522#${id}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(15000);
            await page.screenshot({path:'output/hash-page.png',fullPage:true});
            fs.writeFileSync('output/hash-page.html',await page.content());
            fs.writeFileSync('output/resources.json',JSON.stringify(await page.evaluate(()=>performance.getEntriesByType('resource').map(x=>x.name)),null,2));
          }catch(e){results.push({mode:'hash-navigation',error:String(e)});}
          // Download the page bundle and preserve snippets around endpoint strings.
          try{
            const scripts=await page.locator('script[src]').evaluateAll(xs=>xs.map(x=>x.src).filter(Boolean));
            fs.writeFileSync('output/scripts.json',JSON.stringify(scripts,null,2));
            for(let i=0;i<scripts.length;i++){
              if(!/bundle|mapapp|main\./i.test(scripts[i]))continue;
              const r=await context.request.get(scripts[i],{timeout:120000});
              const t=await r.text();
              const keys=['flight-playback','feedPlayback','trailLimit','download/?file'];
              let snippets='';
              for(const k of keys){let pos=0,c=0;while((pos=t.indexOf(k,pos))>=0&&c<10){snippets+=`\n--- ${k} @ ${pos} ---\n`+t.slice(Math.max(0,pos-1000),pos+1800);pos+=k.length;c++;}}
              if(snippets)fs.writeFileSync(`output/script_snippets_${i}.txt`,snippets);
            }
          }catch(e){results.push({mode:'bundle-analysis',error:String(e)});}
          fs.writeFileSync('output/results.json',JSON.stringify(results,null,2));
          fs.writeFileSync('output/captured.json',JSON.stringify(captured,null,2));
          await browser.close();
          JS
          node fetch.mjs || true
          find output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - name: Upload endpoint probe
        uses: actions/upload-artifact@v4
        with:
          name: cz6522-playback-endpoint-probe
          path: output/*
          if-no-files-found: error
          retention-days: 1
