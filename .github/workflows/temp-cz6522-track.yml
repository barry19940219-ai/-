name: Temporary CZ6522 July 8 playback retry

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retry July 8 with forced DOM click
        shell: bash
        run: |
          set -u
          mkdir -p output
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          cat > fetch.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const f={date:'2026-07-08',id:'408e4798',ts:'1783476300',reg:'B-32PR'};
          const summary={...f}; let browser;
          try{
            browser=await chromium.launch({channel:'chrome',headless:false,args:['--no-sandbox','--disable-blink-features=AutomationControlled','--disable-dev-shm-usage','--start-maximized']});
            const context=await browser.newContext({viewport:null,locale:'en-US',timezoneId:'UTC'});
            await context.addInitScript(()=>{
              Object.defineProperty(navigator,'webdriver',{get:()=>undefined});
              Object.defineProperty(navigator,'languages',{get:()=>['en-US','en']});
              Object.defineProperty(navigator,'plugins',{get:()=>[1,2,3,4,5]});
            });
            const page=await context.newPage();
            await page.goto('https://www.flightradar24.com/data/flights/cz6522',{waitUntil:'domcontentloaded',timeout:120000});
            for(let i=0;i<45;i++){await page.waitForTimeout(1000);if(await page.locator('#tbl-datatable').count())break;}
            const challenge=await context.newPage();
            await challenge.goto(`https://api.flightradar24.com/common/v1/flight-playback.json?flightId=${f.id}&timestamp=${f.ts}`,{waitUntil:'domcontentloaded',timeout:120000}).catch(()=>null);
            for(let i=0;i<70;i++){
              await challenge.waitForTimeout(1000);
              const txt=(await challenge.title().catch(()=>''))+' '+(await challenge.locator('body').innerText().catch(()=>''));
              if(!/just a moment|performing security verification|verify you are human/i.test(txt))break;
            }
            await challenge.close(); await page.bringToFront();
            await page.evaluate(()=>{
              document.querySelectorAll('#gravitoCMPRoot, .gravitoCMP-opaque-container, ins[data-anchor-shown], iframe[aria-label="Advertisement"]').forEach(x=>x.remove());
            });
            const promise=page.waitForResponse(r=>r.url().includes('flight-playback.json')&&r.url().includes(f.id),{timeout:150000});
            const button=page.locator(`#btn-playback-${f.id}`);
            await button.evaluate(el=>el.click());
            const resp=await promise; const body=await resp.body();
            const file=`output/${f.date}_${f.reg}_${f.id}.json`; fs.writeFileSync(file,body);
            const d=JSON.parse(body.toString()); const flight=d?.result?.response?.data?.flight;
            Object.assign(summary,{status:resp.status(),bytes:body.length,points:flight?.track?.length,registration:flight?.aircraft?.identification?.registration,callsign:flight?.identification?.callsign,file});
            await context.close();
          }catch(e){summary.error=String(e);fs.writeFileSync('output/error.txt',String(e));}
          finally{if(browser)await browser.close().catch(()=>{});fs.writeFileSync('output/summary.json',JSON.stringify(summary,null,2));}
          JS
          xvfb-run -a node fetch.mjs || true
          cat output/summary.json
      - name: Upload July 8 playback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cz6522-track-2026-07-08-retry
          path: output/*
          if-no-files-found: error
          retention-days: 1
